name: Deploy to Shared Hosting

# Layout in the domain folder on the server:
#   /             static Next.js export (frontend, from out/)
#   /backend/     Laravel API (only reachable through the rewrites in /.htaccess)
#   /backend/.env production settings, created by hand on the server, never uploaded
#
# Uploading thousands of files one by one over FTPS takes ~1h and the host drops the
# connection, so CI uploads one zip + a one-shot installer (.github/deploy/_deploy.php)
# and triggers it over HTTPS.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # Nothing reaches the server unless every check below passes.
  test:
    name: ✅ Lint, test and audit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cineora_test
          MYSQL_USER: cineora
          MYSQL_PASSWORD: cineora
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          tools: composer:v2
          coverage: none

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: |
          npm ci
          (cd backend && composer install --prefer-dist --no-interaction --no-progress)

      - name: 🧹 Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: 🧪 Frontend unit tests
        run: npm test

      - name: 🛡️ Dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          (cd backend && composer audit --no-dev)

      - name: 🗄️ Prepare test databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS cineora_e2e; GRANT ALL ON cineora_test.* TO 'cineora'@'%'; GRANT ALL ON cineora_e2e.* TO 'cineora'@'%'; FLUSH PRIVILEGES;"
          cd backend
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=cineora/' .env
          php artisan key:generate --force

      - name: 🐘 Backend tests (MySQL)
        working-directory: backend
        run: php artisan test

      - name: 🎭 Browser tests (Playwright)
        run: |
          npx playwright install --with-deps chrome
          npm run e2e

      - name: 📎 Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: 🎉 Build & Deploy site + API
    needs: test
    # Pull requests are tested only; they never deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never let two deploys upload over each other.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          tools: composer:v2
          coverage: none

      - name: 📦 Install backend dependencies (production)
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci

      # next.config.ts uses `output: "export"`: the static site is written to out/.
      # The API lives on the same origin, so the API base URL is the site URL.
      - name: 🏗️ Build frontend (static export)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.DEPLOY_URL }}
        run: npm run build

      - name: 📂 Prepare deployment directory
        run: |
          mkdir -p dist/backend
          cp -r out/. dist/
          cp -r backend/. dist/backend/

          b=dist/backend
          # Never ship secrets, dev tooling, tests or local runtime state.
          rm -f  $b/.env $b/.env.backup $b/.env.production $b/.phpunit.result.cache
          rm -rf $b/scratch $b/tests $b/node_modules $b/.phpunit.cache
          rm -f  $b/phpunit.xml $b/AGENTS.md $b/CLAUDE.md
          # public/storage is a local symlink; /storage is served by a rewrite in /.htaccess instead.
          rm -rf $b/public/storage
          # Compiled caches and local logs/sessions from a dev machine must not reach the server.
          find $b/bootstrap/cache -type f ! -name '.gitignore' -delete
          find $b/storage -type f ! -name '.gitignore' -delete
          # Runtime folders Laravel needs on first deploy.
          for d in bootstrap/cache storage/app/public storage/app/private storage/logs \
                   storage/framework/cache/data storage/framework/sessions storage/framework/views; do
            mkdir -p "$b/$d" && touch "$b/$d/.keep"
          done

      - name: 📝 Create production .htaccess at root
        run: |
          cat << 'EOF' > dist/.htaccess
          Options -Indexes -MultiViews
          DirectoryIndex index.html
          ServerSignature Off
          ErrorDocument 404 /404.html

          <IfModule mod_headers.c>
              Header always set X-Content-Type-Options "nosniff"
              Header always set X-Frame-Options "DENY"
              Header always set Referrer-Policy "strict-origin-when-cross-origin"
              Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
              # Site pages only: the API sets its own stricter CSP (and a sandbox on proof files), which must win.
              # The static export inlines its own bootstrap scripts (no server to add nonces), so scripts need
              # 'unsafe-inline'; everything else is locked to this origin. blob: = proof previews, data: = QR codes.
              <If "%{REQUEST_URI} !~ m#^/(api|sanctum|storage)/#">
                  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob: https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
              </If>
              Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
              # Only the staff area may ask for the camera (door scanner, paired phone scanner). It must cover every
              # /admin/ page, not just the scanner URLs: the policy is fixed when the document loads, and admin pages
              # switch without a reload, so opening the scanner from the dashboard keeps the dashboard's policy.
              # Android Chrome then refuses the camera silently, with no permission prompt (iOS Safari ignores it).
              <If "%{REQUEST_URI} =~ m#^/admin/#">
                  Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
              </If>
              # Hashed build assets never change; pages must always be revalidated.
              <If "%{REQUEST_URI} =~ m#^/_next/static/#">
                  Header set Cache-Control "public, max-age=31536000, immutable"
              </If>
              <ElseIf "%{REQUEST_URI} !~ m#^/(api|sanctum|storage)/#">
                  Header set Cache-Control "no-cache"
              </ElseIf>
          </IfModule>

          <IfModule mod_rewrite.c>
              RewriteEngine On

              # Force HTTPS.
              RewriteCond %{HTTPS} !=on
              RewriteCond %{HTTP:X-Forwarded-Proto} !=https
              RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

              # Pass auth headers through to PHP (Sanctum / CSRF).
              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              # One-shot release installer; only exists for a few seconds during a deploy
              # and answers 404 to anything without the deploy token.
              RewriteRule ^_deploy\.php$ - [END]

              # Laravel: API, Sanctum CSRF cookie and the public storage disk.
              RewriteRule ^storage/(.+)$ backend/storage/app/public/$1 [END]
              RewriteRule ^(api|sanctum)(/.*)?$ backend/public/index.php [END,QSA]

              # Nothing else under backend/ is reachable (code, vendor, .env, logs, uploads).
              RewriteRule ^backend(/|$) - [F,L]

              # Dotfiles, except ACME challenges.
              RewriteRule (^|/)\.(?!well-known/) - [F,L]

              # Real files and folders of the export are served as-is. Without this, the redirects below catch
              # Next's own payload files (e.g. /movies/index.txt) and send them to /movies/view/?slug=index.txt.
              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              # Static images are WebP now; rows seeded before the switch may still point at .jpg/.png.
              RewriteRule ^((?:images|brand)/.+)\.(?:jpe?g|png)$ /$1.webp [R=301,L]

              # Old pretty URLs (and links in already-sent emails) -> static pages that read the id from the query.
              RewriteRule ^movies/(?!view/?$)([^/]+)/?$ /movies/view/?slug=$1 [R=301,L]
              RewriteRule ^events/(?!view/?$)([^/]+)/?$ /events/view/?slug=$1 [R=301,L]
              RewriteRule ^news/(?!view/?$)([^/]+)/?$ /news/view/?slug=$1 [R=301,L]
              RewriteRule ^booking/(?!seats/?$|checkout/?$)([^/]+)/?$ /booking/seats/?showtime=$1 [R=301,L]
              RewriteRule ^account/bookings/(?!view/?$)([^/]+)/?$ /account/bookings/view/?id=$1 [R=301,L]
              RewriteRule ^admin/cinemas/rooms/([^/]+)/seats/?$ /admin/cinemas/rooms/seats/?room=$1 [R=301,L]
          </IfModule>

          # Belt and braces if mod_rewrite is off.
          <FilesMatch "^\.">
              Require all denied
          </FilesMatch>
          EOF

      - name: 🗜️ Build release archive
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN secret is not set"; exit 1; }
          (cd dist && zip -qr -9 ../release.zip . -x '*.git*')
          ls -lh release.zip
          hash=$(printf '%s' "$DEPLOY_TOKEN" | sha256sum | cut -d' ' -f1)
          sed "s/__TOKEN_SHA256__/$hash/" .github/deploy/_deploy.php > _deploy.php

      - name: 📤 Upload release over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Domain folder relative to the FTP login folder, with trailing slash (e.g. "public_html/").
          SERVER_DIR: ""
        run: |
          up() {
            curl --ssl-reqd --ftp-create-dirs --retry 3 --retry-all-errors -sS \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              -T "$1" "ftp://$FTP_SERVER:21/$SERVER_DIR$2"
          }
          # .htaccess first so the installer is reachable.
          up dist/.htaccess .htaccess
          up release.zip release.zip
          up _deploy.php _deploy.php

      - name: 🚀 Install release on server
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS --max-time 600 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "${DEPLOY_URL%/}/_deploy.php"
